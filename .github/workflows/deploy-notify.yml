name: Deploy Notify

on:
  workflow_call:
    inputs:
      phase:             { type: string, required: true }   # start | result
      service_name:      { type: string, required: true }
      environment:       { type: string, required: true }   # dev | stage | prod
      apps:              { type: string, required: false, default: "" }
      image_tag:         { type: string, required: false, default: "" }
      deploy_status:     { type: string, required: false, default: "" }
      version_bump:      { type: string, required: false, default: "auto" }
      # 릴리즈 경로에서는 필수지만 선언상 optional 이다. `phase: start` 호출은
      # glob 을 넘기지 않으므로 required: true 로 두면 시작 알림이 전부 깨진다.
      # 릴리즈 경로의 런타임 가드가 빈 값을 거부한다 (스펙 §4.3).
      migration_glob:    { type: string, required: false, default: "" }
      api_path_glob:     { type: string, required: false, default: "" }
      api_exclude_glob:  { type: string, required: false, default: "**/*.spec.ts,**/*Test.kt,**/test/**" }
      dev_channel_id:    { type: string, required: true }
      release_channel_id: { type: string, required: false, default: "" }
      max_commits:       { type: string, required: false, default: "100" }
    secrets:
      SLACK_NOTIFICATION_TOKEN: { required: true }
      ARGOCD_SERVER_DEV:        { required: false }
      ARGOCD_SERVER_STAGE:      { required: false }
      ARGOCD_SERVER_PROD:       { required: false }
    outputs:
      thread_ts:
        description: "참고용. Slack 메시지 ts"
        value: ${{ jobs.notify.outputs.thread_ts }}

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.send.outputs.thread_ts }}
      version:   ${{ steps.release_ctx.outputs.version }}
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0        # 커밋 범위 계산에 전체 이력 필요
          fetch-tags: true      # deployed/{env} 와 v* 태그 필요

      - name: Checkout willog-actions
        uses: actions/checkout@v6
        with:
          repository: willog-platform/willog-actions
          # 재사용 워크플로 자신의 커밋 sha. `github.workflow_sha` 는 최상위
          # (호출자) 워크플로를 가리키므로 여기서는 틀린다. 이 값을 써야
          # 호출 측의 @v1 / @<sha> 핀과 스크립트 버전이 일치한다.
          ref: ${{ github.job_workflow_sha }}
          path: .willog-actions

      - name: Resolve ArgoCD URL
        id: argo
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SERVICE: ${{ inputs.service_name }}
          SRV_DEV: ${{ secrets.ARGOCD_SERVER_DEV }}
          SRV_STAGE: ${{ secrets.ARGOCD_SERVER_STAGE }}
          SRV_PROD: ${{ secrets.ARGOCD_SERVER_PROD }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev)   HOST="$SRV_DEV" ;;
            stage) HOST="$SRV_STAGE" ;;
            prod)  HOST="$SRV_PROD" ;;
            *)     HOST="" ;;
          esac
          # HOST 가 비면 링크를 만들지 않는다. 예전 코드는 조건 없이
          # `https:///applications/...` (호스트 없는 URL) 를 내보냈고, 그것이
          # 그대로 Slack 메시지의 `<url|ArgoCD>` 에 들어가 **끊긴 링크가
          # 이유 없이 노출**됐다. 시크릿 누락이나 environment 오타 때
          # 조용히 망가지는 대신 빈 값을 내보내고 경고를 남긴다.
          # 렌더러는 빈 argocd_url 을 링크 없는 평문으로 처리한다.
          if [ -z "$HOST" ]; then
            # 로그 라인에 넣기 전에 개행·CR 을 지운다. Actions 러너는 stdout 을
            # **줄 단위로** 훑어 `::command::` 를 해석하므로, 값에 개행이 있으면
            # 가짜 `::error::`·`::add-mask::` 같은 워크플로 커맨드를 로그에
            # 주입할 수 있다. 셸 인젝션과는 별개 부류다.
            ENV_SAFE="$(printf '%s' "$ENVIRONMENT" | tr -d '\n\r')"
            echo "::warning::ARGOCD_SERVER 시크릿이 없거나 environment 가 예상 밖입니다 (환경='${ENV_SAFE}') — ArgoCD 링크를 생략합니다"
            echo "url=" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${HOST}/applications/argocd/${SERVICE}-${ENVIRONMENT}?view=tree&resource=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve commit range
        id: range
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          MAX_COMMITS: ${{ inputs.max_commits }}
        run: |
          set -euo pipefail
          # resolve-base.sh 자신의 `jq -n` 은 compact(-c)가 아니라 여러 줄로 예쁘게
          # 출력한다. 그대로 `echo "json=${RANGE}"` 로 쓰면 여러 줄 값이 되어
          # GITHUB_OUTPUT 의 줄 단위 파서를 깨뜨린다(제약 #2와 동일한 위험 클래스).
          # stdout만 `jq -c` 로 압축한다 — stderr(::notice::/::warning::)는 파이프를
          # 타지 않으므로 그대로 잡 로그에 남는다.
          RANGE="$(bash .willog-actions/scripts/resolve-base.sh "$ENVIRONMENT" | jq -c '.')"
          echo "json=${RANGE}" >> "$GITHUB_OUTPUT"

      - name: Choose channel
        id: channel
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PHASE: ${{ inputs.phase }}
          STATUS: ${{ inputs.deploy_status }}
          DEV_CH: ${{ inputs.dev_channel_id }}
          REL_CH: ${{ inputs.release_channel_id }}
          RANGE_JSON: ${{ steps.range.outputs.json }}
        run: |
          set -euo pipefail
          # 릴리즈 노트 형식을 쓰는 경우에만 릴리즈 채널로 보낸다.
          RELEASE=false
          if [ "$PHASE" = "result" ] && [ "$STATUS" = "success" ] \
             && { [ "$ENVIRONMENT" = "stage" ] || [ "$ENVIRONMENT" = "prod" ]; }; then
            RELEASE=true
          fi

          # 커밋 범위가 비면(= 같은 커밋 재배포) 릴리즈 경로를 타지 않는다.
          # 재실행은 실운영에서 흔하다(ArgoCD 일시 실패, promote 재시도). 그런데
          # 첫 실행이 만든 `v1.0.0` 이 이제 HEAD 에서 도달 가능하므로
          # next-version.sh 가 `v1.0.1` 을 계산하고, 파이프라인은 **내용이 빈
          # 릴리즈**(PR 0건·마이그레이션 0건)를 위해 새 태그와 GitHub Release 를
          # 만들고 `<!here>` 로 사람들을 부른다. 정확한 릴리즈 전달이라는 이
          # 설계의 목적과 정반대다.
          # 새로 나간 것이 없으면 릴리즈가 아니다 — 배포 사실만 간소 형식으로
          # 알린다. 마커 태그는 어차피 같은 자리로 이동하므로 무해하다.
          # fail-safe 로 판정한다: **양의 정수임이 확인될 때만** 릴리즈 경로를
          # 유지한다. 빈 문자열이나 `null`("commits" 키 부재) 같은 값을
          # `= "0"` 비교로만 걸러내면, 읽을 수 없는 범위가 오히려 릴리즈 경로를
          # **켜 둔 채** 통과한다 — 막으려던 실패 부류와 같은 방향이다.
          COMMITS="$(printf '%s' "$RANGE_JSON" | jq -r '.commits // empty' 2>/dev/null || true)"
          case "$COMMITS" in
            0)
              if [ "$RELEASE" = true ]; then
                echo "::notice::커밋 범위가 비어 있습니다 (같은 커밋 재배포) — 새 버전을 만들지 않고 간소 형식으로 알립니다"
                RELEASE=false
              fi ;;
            0*)
              # `00`·`007` 처럼 선행 0 이 붙은 값도 0 일 수 있고, 이 파이프라인이
              # 낼 리 없는 형태이므로 신뢰하지 않는다. 위 `0)` 분기가 정확히
              # `"0"` 만 잡으므로 여기서 나머지 선행-0 형태를 막는다.
              if [ "$RELEASE" = true ]; then
                echo "::warning::커밋 범위 값이 예상 밖입니다 ('${COMMITS}') — 릴리즈 경로를 끄고 간소 형식으로 알립니다"
                RELEASE=false
              fi ;;
            ''|*[!0-9]*)
              if [ "$RELEASE" = true ]; then
                echo "::warning::커밋 범위를 읽을 수 없습니다 ('${COMMITS}') — 릴리즈 경로를 끄고 간소 형식으로 알립니다"
                RELEASE=false
              fi ;;
          esac
          CH="$DEV_CH"
          if [ "$RELEASE" = true ]; then
            if [ -n "$REL_CH" ]; then
              CH="$REL_CH"
            else
              # 형식은 릴리즈 노트 그대로이고 채널만 dev 로 폴백한다
              # (스펙 §4.3). 알림을 잃는 것보다 낫지만, 조용히 넘기지 않는다 —
              # 설정을 빠뜨린 사람이 로그에서 알아볼 수 있어야 한다.
              echo "::warning::release_channel_id 가 지정되지 않았습니다 — 릴리즈 노트를 dev 채널로 보냅니다"
            fi
          fi
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "id=${CH}"          >> "$GITHUB_OUTPUT"

      - name: Build simple context
        id: simple_ctx
        if: ${{ steps.channel.outputs.release != 'true' }}
        env:
          # ── Actions 스크립트 인젝션 방어 ────────────────────────────
          # `${{ }}` 표현식을 `run:` 스크립트 **본문**에 직접 보간하지 않는다.
          # Actions 는 셸이 실행되기 **전에** 텍스트로 치환하므로,
          # `--arg x '${{ inputs.y }}'` 에서 값에 작은따옴표가 들어가면 인용을
          # 탈출해 임의 명령이 실행된다. 전량 env 로 넘기고 `"$VAR"` 로만 읽는다.
          # (env 값은 프로세스 환경으로 전달되므로 셸 파싱을 거치지 않는다.)
          SERVICE_NAME: ${{ inputs.service_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          DEPLOY_STATUS: ${{ inputs.deploy_status }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APPS: ${{ inputs.apps }}
          ARGOCD_URL: ${{ steps.argo.outputs.url }}
          CHANNEL: ${{ steps.channel.outputs.id }}
          RANGE_JSON: ${{ steps.range.outputs.json }}
        run: |
          set -euo pipefail
          case "$ENVIRONMENT" in
            dev) LABEL=Development ;; stage) LABEL=Staging ;; prod) LABEL=Production ;;
            *) LABEL="$ENVIRONMENT" ;;
          esac
          # `-c` 가 필수다. jq 의 기본 출력은 여러 줄이고, 여러 줄 값을
          # GITHUB_OUTPUT 에 `name=value` 로 쓰면 줄 단위 파서가 깨져
          # **임의의 output 을 주입**할 수 있다.
          CTX="$(jq -n -c \
            --arg service_name  "$SERVICE_NAME" \
            --arg environment   "$ENVIRONMENT" \
            --arg env_label     "$LABEL" \
            --arg repo          "$REPO" \
            --arg run_id        "$RUN_ID" \
            --arg actor         "$ACTOR" \
            --arg deploy_status "$DEPLOY_STATUS" \
            --arg image_tag     "$IMAGE_TAG" \
            --arg apps          "$APPS" \
            --arg argocd_url    "$ARGOCD_URL" \
            --arg channel       "$CHANNEL" \
            --argjson range     "$RANGE_JSON" \
            '{service_name:$service_name, environment:$environment, env_label:$env_label,
              repo:$repo, run_id:$run_id, actor:$actor, deploy_status:$deploy_status,
              image_tag:$image_tag, apps:$apps, argocd_url:$argocd_url, channel:$channel,
              range:$range}')"
          printf 'json=%s\n' "$CTX" >> "$GITHUB_OUTPUT"

      - name: Send simple notification
        id: send_simple
        if: ${{ steps.channel.outputs.release != 'true' }}
        env:
          TOKEN: ${{ secrets.SLACK_NOTIFICATION_TOKEN }}
          CTX: ${{ steps.simple_ctx.outputs.json }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          PAYLOAD="$(printf '%s' "$CTX" | jq -f .willog-actions/scripts/render-simple.jq --arg phase "$PHASE")"
          # 타임아웃 없는 curl 은 Slack 이 응답하지 않을 때 job 타임아웃까지
          # 매달린다. 알림 하나 때문에 러너를 붙잡아 둘 이유가 없다.
          RESP="$(curl -sS --connect-timeout 10 --max-time 30 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "$PAYLOAD")"
          printf '%s' "$RESP" | jq -e '.ok' >/dev/null \
            || { printf '::error::Slack 전송 실패: %s\n' "$(printf '%s' "$RESP" | jq -r '.error // "unknown"')"; exit 1; }
          # 전송이 확인됐음을 마커 이동 스텝에 알린다. 릴리즈 경로의 thread_ts 와
          # 같은 역할이다 — 마커는 **어느 경로든 전송이 확인됐을 때만** 이동해야 한다.
          echo "sent=true" >> "$GITHUB_OUTPUT"

      - name: Build release context
        id: release_ctx
        if: ${{ steps.channel.outputs.release == 'true' }}
        env:
          # `${{ }}` 를 run: 본문에 보간하지 않는다 (Actions 스크립트 인젝션).
          # 전량 env 로 넘기고 "$VAR" 로만 읽는다.
          GH_TOKEN: ${{ github.token }}
          SERVICE_NAME: ${{ inputs.service_name }}
          ENVIRONMENT: ${{ inputs.environment }}
          MAX_COMMITS: ${{ inputs.max_commits }}
          MIGRATION_GLOB: ${{ inputs.migration_glob }}
          API_GLOB: ${{ inputs.api_path_glob }}
          API_EXCLUDE: ${{ inputs.api_exclude_glob }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APPS: ${{ inputs.apps }}
          ARGOCD_URL: ${{ steps.argo.outputs.url }}
          CHANNEL: ${{ steps.channel.outputs.id }}
          RANGE_JSON: ${{ steps.range.outputs.json }}
        run: |
          set -euo pipefail
          S=.willog-actions/scripts
          RANGE="$RANGE_JSON"
          BASE="$(printf '%s' "$RANGE" | jq -r '.base')"
          HEAD_SHA="$(printf '%s' "$RANGE" | jq -r '.head')"

          # 공백만인 값도 거부한다. `[ -n " " ]` 은 참이므로 트림 없이는
          # 파이프라인이 collect-prs.sh(커밋당 gh api 호출)와 fetch-prs.sh 까지
          # 진행한 뒤 detect-changes.sh 안쪽 가드에서야 죽는다. 최종 안전성은
          # 같지만 "일 시작 전에 크게 실패한다"가 지켜지지 않고 API 호출을 낭비한다.
          if [ -z "$(printf '%s' "$MIGRATION_GLOB" | tr -d '[:space:]')" ]; then
            echo "::error::migration_glob 이 비어 있거나 공백뿐입니다 (repo마다 경로가 다릅니다)"
            exit 1
          fi

          NUMS="$(bash "$S/collect-prs.sh" "$REPO" "$BASE" "$HEAD_SHA")"
          RAW="$(bash "$S/fetch-prs.sh"   "$REPO" "$NUMS")"
          PRS="$(printf '%s' "$RAW" | jq -f "$S/summarize.jq")"

          CHANGES="$(bash "$S/detect-changes.sh" "$BASE" "$HEAD_SHA" \
                      "$MIGRATION_GLOB" "$API_GLOB" "$API_EXCLUDE")"

          LABELS="$(printf '%s' "$PRS" | jq -c '[.[].labels[]] | unique')"
          VERSION="$(bash "$S/next-version.sh" "$LABELS" "$VERSION_BUMP")"

          case "$ENVIRONMENT" in
            stage) LABEL=Staging ;; prod) LABEL=Production ;; *) LABEL="$ENVIRONMENT" ;;
          esac
          MENTION=""
          if [ "$ENVIRONMENT" = "prod" ]; then MENTION="<!here>"; fi

          # `-c` 필수: 여러 줄 JSON 을 GITHUB_OUTPUT 에 쓰면 줄 단위 파서가
          # 깨져 임의 output 주입이 가능하다.
          CTX="$(jq -n -c \
            --arg service_name  "$SERVICE_NAME" \
            --arg environment   "$ENVIRONMENT" \
            --arg env_label     "$LABEL" \
            --arg repo          "$REPO" \
            --arg run_id        "$RUN_ID" \
            --arg actor         "$ACTOR" \
            --arg deploy_status 'success' \
            --arg image_tag     "$IMAGE_TAG" \
            --arg apps          "$APPS" \
            --arg argocd_url    "$ARGOCD_URL" \
            --arg channel       "$CHANNEL" \
            --arg mention       "$MENTION" \
            --argjson range     "$RANGE" \
            --argjson version   "$VERSION" \
            --argjson prs       "$PRS" \
            --argjson changes   "$CHANGES" \
            '{service_name:$service_name, environment:$environment, env_label:$env_label,
              repo:$repo, run_id:$run_id, actor:$actor, deploy_status:$deploy_status,
              image_tag:$image_tag, apps:$apps, argocd_url:$argocd_url, channel:$channel,
              mention:$mention, range:$range, version:$version, prs:$prs, changes:$changes}')"

          printf 'json=%s\n' "$CTX" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(printf '%s' "$VERSION" | jq -r '.next')" >> "$GITHUB_OUTPUT"

      - name: Send release note
        id: send
        if: ${{ steps.channel.outputs.release == 'true' }}
        env:
          TOKEN: ${{ secrets.SLACK_NOTIFICATION_TOKEN }}
          CTX: ${{ steps.release_ctx.outputs.json }}
        run: |
          set -euo pipefail
          S=.willog-actions/scripts

          MAIN="$(printf '%s' "$CTX" | jq -f "$S/render-main.jq")"
          # 타임아웃 없는 curl 은 Slack 이 응답하지 않을 때 job 타임아웃까지
          # 매달린다. 알림 하나 때문에 러너를 붙잡아 둘 이유가 없다.
          RESP="$(curl -sS --connect-timeout 10 --max-time 30 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "$MAIN")"
          printf '%s' "$RESP" | jq -e '.ok' >/dev/null \
            || { printf '::error::Slack 본체 전송 실패: %s\n' "$(printf '%s' "$RESP" | jq -r '.error // "unknown"')"; exit 1; }

          # `.ts // empty` 를 쓴다. `jq -r '.ts'` 는 없거나 null 인 값에 대해
          # 문자열 "null" 을 내고, 그것은 비어 있지 않아 마커 태그 게이트를
          # 통과한다. 개행 제거는 GITHUB_OUTPUT 주입 방어다.
          TS="$(printf '%s' "$RESP" | jq -r '.ts // empty' | tr -d '\n\r')"
          if [ -z "$TS" ]; then
            echo "::error::Slack 응답에 ts 가 없습니다 — 스레드를 달 수 없고, 전송을 확인할 수 없으므로 마커 태그도 이동하지 않습니다"
            exit 1
          fi
          echo "thread_ts=${TS}" >> "$GITHUB_OUTPUT"

          THREAD="$(printf '%s' "$CTX" | jq -f "$S/render-thread.jq" --arg thread_ts "$TS")"
          RESP2="$(curl -sS --connect-timeout 10 --max-time 30 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary "$THREAD")"
          # 스레드 실패는 본체를 무효화하지 않는다. 경고로만 남긴다.
          printf '%s' "$RESP2" | jq -e '.ok' >/dev/null \
            || printf '::warning::스레드 답글 전송 실패: %s\n' "$(printf '%s' "$RESP2" | jq -r '.error // "unknown"')"

      - name: Create version tag and release (prod only)
        if: ${{ steps.channel.outputs.release == 'true' && inputs.environment == 'prod' && steps.send.outputs.thread_ts != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_ctx.outputs.version }}
          CTX: ${{ steps.release_ctx.outputs.json }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" >/dev/null; then
            echo "::warning::태그 ${VERSION} 이 이미 존재합니다 — Release 생성을 건너뜁니다"
            exit 0
          fi

          NOTES="$(printf '%s' "$CTX" | jq -r '
            "## 이번 릴리즈\n\n"
            + (if (.prs|length) == 0 then "- (PR 없음)"
               else (.prs | map("- #" + (.number|tostring) + " " + .summary) | join("\n")) end)
            + "\n\n## 마이그레이션\n\n"
            + (if (.changes.migrations|length) == 0 then "- 없음"
               else (.changes.migrations | map("- " + .) | join("\n")) end)
            + "\n\n커밋 범위: `" + .range.base + ".." + .range.head + "`"')"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

          printf '%s' "$NOTES" | gh release create "$VERSION" \
            --title "Release ${VERSION}" --notes-file -

      # `always()` 를 붙이는 이유: `v{semver}` push 는 성공했는데 `gh release create`
      # 만 일시 API 오류로 실패하면, 알림은 이미 나갔고 권한도 정상인데 마커가
      # 멈춘다 — §8 이 승인한 실패 모드(권한 부재)와 다른 우연한 결합이다.
      #
      # **그러나 `always()` 만 붙이면 더 나쁜 구멍이 열린다.** `range` 나 `channel`
      # 이 실패하면 `RELEASE` 가 `"false"` 가 아니라 **빈 값**이 되고, 아래 가드의
      # `[ "$RELEASE" = "true" ]` 는 거짓이 되어 **알림을 한 통도 보내지 않은
      # 상태로 마커가 이동한다** — 그 커밋 범위는 모든 미래 노트에서 영구히
      # 사라진다. `always()` 이전에는 Actions 가 이 스텝을 건너뛰어 암묵적으로
      # 보호하고 있었다(2026-08-28 리뷰에서 실측 확인).
      # 그래서 `steps.channel.outcome == 'success'` 를 명시적 전제로 둔다:
      # RELEASE 를 **알 수 있을 때만** 이 스텝이 판단할 자격이 있다.
      # 아래 가드에도 빈 값 방어를 함께 둔다(같은 실수를 두 번 하지 않기 위해).
      - name: Move deployed marker tag
        if: ${{ always() && steps.channel.outcome == 'success' && inputs.phase == 'result' && inputs.deploy_status == 'success' }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RELEASE: ${{ steps.channel.outputs.release }}
          SENT: ${{ steps.send.outputs.thread_ts }}
          SENT_SIMPLE: ${{ steps.send_simple.outputs.sent }}
        run: |
          set -euo pipefail
          # 릴리즈 노트 경로에서는 전송 성공을 확인한 뒤에만 기준점을 옮긴다.
          # 실패 시 옮기지 않으면 다음 배포 노트가 두 배포분을 담아 자동 복구된다.
          #
          # 불변식은 경로와 무관하게 하나다: **전송이 확인됐을 때만 이동한다.**
          #  · `RELEASE` 빈 값 = "알 수 없음"(channel 미실행) → 이동 금지.
          #    빈 값은 "간소 경로(false)"가 아니다.
          #  · 릴리즈 경로 → `thread_ts` 로 확인.
          #  · 간소 경로 → `send_simple.sent` 로 확인.
          # 경로별로 다른 규칙을 두면 한쪽을 고칠 때 다른 쪽이 남는다 — 실제로
          # 릴리즈 경로만 보호한 채 두 라운드를 썼고, 간소 경로가 거울상으로
          # 남아 있었다(2026-08-28 리뷰).
          if [ -z "$RELEASE" ] \
             || { [ "$RELEASE" = "true" ]  && [ -z "$SENT" ]; } \
             || { [ "$RELEASE" = "false" ] && [ -z "$SENT_SIMPLE" ]; }; then
            echo "::warning::Slack 전송 미확인 — deployed/${ENVIRONMENT} 를 옮기지 않습니다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "deployed/${ENVIRONMENT}" "$(git rev-parse HEAD)"
          git push -f origin "refs/tags/deployed/${ENVIRONMENT}"
          echo "::notice::deployed/${ENVIRONMENT} → $(git rev-parse --short HEAD)"
